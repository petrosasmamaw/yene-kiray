<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldRoof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="swooshGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dark Base Chimney Pillar -->
  <rect x="128" y="44" width="22" height="110" rx="3" fill="#1C1C1E" stroke="#2C2C2E" stroke-width="2"/>

  <!-- Golden Roof Gable -->
  <path d="M 100 28 L 160 84 L 146 96 L 100 52 L 54 96 L 40 84 Z" fill="url(#goldRoof)" filter="url(#glow)"/>

  <!-- Left Wall Pillar -->
  <rect x="54" y="90" width="16" height="74" fill="url(#goldRoof)"/>

  <!-- Attic Windows (4 square gold tiles) -->
  <g fill="url(#goldRoof)">
    <rect x="85" y="76" width="12" height="12" rx="2"/>
    <rect x="103" y="76" width="12" height="12" rx="2"/>
    <rect x="85" y="94" width="12" height="12" rx="2"/>
    <rect x="103" y="94" width="12" height="12" rx="2"/>
  </g>

  <!-- Key in Center (Pure Crisp White) -->
  <g fill="#FFFFFF" stroke="#000000" stroke-width="1.5">
    <!-- Key Head Circle -->
    <circle cx="120" cy="120" r="14" fill="#FFFFFF"/>
    <circle cx="120" cy="120" r="6" fill="#0D0D0D"/>
    <!-- Key Stem Angled -->
    <path d="M 110 126 L 78 152 L 78 142 L 88 134 L 88 126 L 100 116 Z" fill="#FFFFFF"/>
  </g>

  <!-- Golden Orbital Swoosh -->
  <path d="M 30 156 C 26 138 34 168 100 168 C 160 168 184 130 162 108 C 178 118 178 148 146 168 C 122 182 66 182 30 156 Z" fill="url(#swooshGold)" filter="url(#glow)"/>
</svg>
